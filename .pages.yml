media:
  input: media
  output: /media

content:
  - name: players
    label: اللاعبون
    type: collection
    path: content/players
    format: json
    filename: "{primary}.json"
    fields:
      - name: name
        label: اسم اللاعب
        type: string
        required: true
      - name: position
        label: مركز اللعب
        type: string
      - name: photo
        label: صورة اللاعب
        type: image
