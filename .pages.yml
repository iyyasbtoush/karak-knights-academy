media: media

content:
  - name: academy
    label: إعدادات الأكاديمية
    type: file
    path: content/academy.json
    format: json
    fields:
      - name: name
        label: اسم الأكاديمية
        type: string
        required: true
      - name: description
        label: نبذة عن الأكاديمية
        type: text
      - name: logo
        label: شعار الأكاديمية
        type: image
      - name: cover
        label: صورة الواجهة
        type: image
      - name: phone
        label: رقم الهاتف
        type: string
      - name: whatsapp
        label: رقم واتساب
        type: string
      - name: facebook
        label: رابط فيسبوك
        type: string
      - name: instagram
        label: رابط إنستغرام
        type: string
      - name: address
        label: عنوان الأكاديمية
        type: text

  - name: players
    label: اللاعبون
    type: collection
    path: content/players
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [name, position, category, number]
      search: [name, position, category]
    fields:
      - name: name
        label: اسم اللاعب
        type: string
        required: true
      - name: photo
        label: صورة اللاعب
        type: image
      - name: number
        label: رقم القميص
        type: number
      - name: position
        label: مركز اللعب
        type: select
        options:
          values:
            - حارس مرمى
            - دفاع
            - وسط
            - هجوم
      - name: category
        label: الفئة العمرية
        type: select
        options:
          values:
            - براعم
            - أشبال
            - ناشئين
            - شباب
            - فئة أولى
      - name: birth_date
        label: تاريخ الميلاد
        type: date
      - name: description
        label: معلومات إضافية
        type: text
      - name: active
        label: اللاعب مسجل حاليًا
        type: boolean

  - name: coaches
    label: المدربون
    type: collection
    path: content/coaches
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [name, specialty, category]
      search: [name, specialty]
    fields:
      - name: name
        label: اسم المدرب
        type: string
        required: true
      - name: photo
        label: صورة المدرب
        type: image
      - name: specialty
        label: التخصص
        type: string
      - name: category
        label: الفئة التي يدربها
        type: string
      - name: experience
        label: سنوات الخبرة
        type: number
      - name: qualifications
        label: الشهادات والخبرات
        type: text
      - name: phone
        label: رقم التواصل
        type: string

  - name: matches
    label: المباريات
    type: collection
    path: content/matches
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, date, opponent, status]
      sort: [date]
      search: [title, opponent]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: عنوان المباراة
        type: string
        required: true
      - name: opponent
        label: الفريق المنافس
        type: string
      - name: date
        label: موعد المباراة
        type: date
      - name: location
        label: الملعب
        type: string
      - name: status
        label: حالة المباراة
        type: select
        options:
          values:
            - قادمة
            - انتهت
            - تأجلت
            - ألغيت
      - name: home_score
        label: أهداف الأكاديمية
        type: number
      - name: away_score
        label: أهداف الفريق المنافس
        type: number
      - name: report
        label: تفاصيل المباراة
        type: text
      - name: photo
        label: صورة المباراة
        type: image

  - name: news
    label: الأخبار والإنجازات
    type: collection
    path: content/news
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, date, category, published]
      sort: [date]
      search: [title, category]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: عنوان الخبر
        type: string
        required: true
      - name: category
        label: نوع المحتوى
        type: select
        options:
          values:
            - أخبار
            - إنجازات
            - بطولات
            - تدريبات
            - إعلانات
      - name: date
        label: تاريخ النشر
        type: date
      - name: image
        label: صورة الخبر
        type: image
      - name: summary
        label: ملخص الخبر
        type: text
      - name: body
        label: تفاصيل الخبر
        type: rich-text
      - name: published
        label: نشر الخبر
        type: boolean

  - name: registrations
    label: التسجيل في الأكاديمية
    type: file
    path: content/registrations.json
    format: json
    fields:
      - name: open
        label: التسجيل مفتوح
        type: boolean
      - name: instructions
        label: تعليمات التسجيل
        type: text
      - name: locations
        label: مواقع التسجيل
        type: object
        list: true
        fields:
          - name: name
            label: اسم الموقع
            type: string
          - name: address
            label: العنوان
            type: string
          - name: phone
            label: رقم التواصل
            type: string
      - name: fees
        label: رسوم الاشتراك
        type: string
      - name: fees_note
        label: ملاحظات الرسوم
        type: string